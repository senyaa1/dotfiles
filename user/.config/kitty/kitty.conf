# Fonts
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0
disable_ligatures always

# Shell
shell /bin/zsh

# Window & Padding
window_padding_width 10
background_opacity 0.4

# Aesthetics (Blur & Cursor Trail)
background_blur 5
cursor_trail 1

foreground #c0caf5

# Normal colors (color0-color7)
color0 #32344a
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #ad8ee6
color6 #449dab
color7 #787c99

# Bright colors (color8-color15)
color8  #444b6a
color9  #ff7a93
color10 #b9f27c
color11 #ff9e64
color12 #7da6ff
color13 #bb9af7
color14 #0db9d7
color15 #acb0d0

linux_display_server wayland
